<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="把生活折好，收进属于自己的柜子。">
  <title>生活收纳柜</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top"><span class="brand-stamp">收</span><span id="site-title">生活收纳柜</span></a>
    <nav>
      <a href="#cabinet">抽屉</a>
      <a href="#notes">日记</a>
      <a href="#about">柜子里的人</a>
    </nav>
    <a class="write-link" href="https://app.pagescms.org/algdmmhh1221/algdmmhh1221.github.io/main" target="_blank" rel="noopener">写点什么 ↗</a>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-paper">
        <p class="kicker">A CABINET FOR ORDINARY DAYS</p>
        <h1>把今天折好，<br>放进生活的<em>抽屉。</em></h1>
        <p id="site-intro">不急着给每一天下定义。写下来，贴上照片，然后把它好好收起来。</p>
        <a class="hero-action" href="#cabinet">打开我的柜子 <span>↓</span></a>
        <span class="tape tape-one"></span>
        <span class="tape tape-two"></span>
      </div>
      <div class="loose-photo">
        <img id="hero-image" src="https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&fit=crop&w=1000&q=85" alt="桌上的手写日记">
        <span id="hero-caption">一些日子，需要被好好留下。</span>
      </div>
    </section>

    <section class="cabinet-section" id="cabinet">
      <div class="section-title">
        <div><span>01</span><h2>生活收纳柜</h2></div>
        <p>点击抽屉，只看被收在里面的日子。</p>
      </div>
      <div class="cabinet" id="drawer-list" aria-label="日记抽屉"></div>
    </section>

    <section class="notes-section" id="notes">
      <div class="section-title">
        <div><span>02</span><h2 id="notes-heading">刚刚收好的日子</h2></div>
        <label class="search"><span>寻找</span><input id="search-input" type="search" placeholder="日期、心情、文字……"></label>
      </div>
      <div class="note-wall" id="note-wall"></div>
      <p class="empty-state" id="empty-state" hidden>这个抽屉暂时还是空的。</p>
    </section>

    <section class="about" id="about">
      <div class="label-tag">柜子使用说明</div>
      <blockquote id="site-quote">“不必每天都精彩。普通日子也值得拥有自己的位置。”</blockquote>
      <p id="site-about">这里不是一份需要完成的任务，只是一只慢慢装满的柜子。你可以随手写下一句话，也可以认真保存一整个季节。</p>
    </section>
  </main>

  <footer><span id="footer-title">生活收纳柜</span><p>慢慢记录，慢慢收好。</p><a href="#top">回到柜子顶部 ↑</a></footer>

  <dialog id="note-dialog">
    <button class="close-dialog" aria-label="关闭日记">×</button>
    <article id="dialog-content"></article>
  </dialog>
  <script src="script.js"></script>
</body>
</html>
